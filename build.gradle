plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.0.0'
group = 'com.sovereign.classui'
base { archivesName = 'sovereignclassui-forge-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    // compile-time only; Forge provides Mixin at runtime
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

jar {
    manifest.attributes(
        'MixinConfigs': 'sovereignclassui.mixins.json',
        'Implementation-Title': 'sovereignclassui',
        'Implementation-Version': project.version
    )
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
